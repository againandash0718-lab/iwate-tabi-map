<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>いわて旅ぬりマップ</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN',sans-serif;background:#f6f8fb;color:#233447}header{padding:13px 16px;background:#173e60;color:white}header strong{font-size:18px}header small{display:block;opacity:.8;margin-top:3px}#map{height:49vh;min-height:270px;background:#e9f1f3}.panel{padding:15px;max-width:720px;margin:auto}.line{display:flex;justify-content:space-between;align-items:center;gap:8px}.muted{color:#647487;font-size:12px}button,select,input,textarea{font:inherit}button{border:0;border-radius:10px;background:#1c608c;color:white;padding:10px 14px}button.secondary{background:#e4ebf0;color:#234}button:disabled{opacity:.5}.colors{display:flex;gap:9px;margin:12px 0;flex-wrap:wrap}.swatch{width:37px;height:37px;border-radius:50%;border:2px solid #cbd2d9;cursor:pointer}.swatch.active{outline:3px solid #1c608c;outline-offset:2px}.field{margin:12px 0}label{display:block;font-size:13px;font-weight:600;margin-bottom:5px}input,textarea,select{width:100%;padding:10px;border:1px solid #cad5df;border-radius:9px;background:white}textarea{min-height:76px}.records{padding:0;list-style:none}.records li{background:white;border:1px solid #e0e5e9;padding:9px;margin:7px 0;border-radius:8px;white-space:pre-wrap}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:12px 0}.town{font-size:12px;padding:9px 2px;background:#e5edf3;color:#234}.town.chosen{background:#1c608c;color:white}.note{font-size:12px;color:#6c7681;line-height:1.6}.hidden{display:none}a{color:#27668f}.status{font-size:12px;margin:6px 0;color:#5b6b78}</style></head><body><header><strong>いわて旅ぬりマップ</strong><small>自分で決める、訪れた市町村の記録</small></header><div id="map"></div><div class="panel"><div class="line"><strong id="selected">市町村を選んでね</strong><span id="progress" class="muted">0 / 33 市町村</span></div><div id="status" class="status">市町村一覧は利用できます。地図を準備中…</div><p class="note">地図の市町村をタップ。境界が表示されない場合は下の市町村一覧から選べます。※境界データは試験機能です。</p><div id="towns" class="grid"></div><div id="editor" class="hidden"><label>地図に塗る色（白で未訪問に戻す）</label><div id="colors" class="colors"></div><div class="field"><label>訪問日</label><input type="date" id="date"></div><div class="field"><label>旅のメモ</label><textarea id="memo" placeholder="立ち寄ったお店、道の駅、食べたものなど"></textarea></div><div class="line"><button id="save">色と記録を保存</button><button id="coloronly" class="secondary">色だけ保存</button></div><h4>これまでの記録</h4><ul id="records" class="records"></ul></div><hr><div class="line"><button id="export" class="secondary">バックアップ保存</button><button id="importBtn" class="secondary">バックアップ読込</button></div><input id="importFile" type="file" accept="application/json" hidden><p class="note">記録はこのブラウザ内に保存します。Safariのデータ削除などで消える可能性があるため、時々バックアップしてください。地図と境界線の表示にはインターネット接続が必要です。</p><p class="note">背景地図：<a href="https://maps.gsi.go.jp/development/ichiran.html">国土地理院 地理院タイル</a>。市町村境界は外部の公開データを取得できた場合に表示します。</p></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const names=['盛岡市','宮古市','大船渡市','花巻市','北上市','久慈市','遠野市','一関市','陸前高田市','釜石市','二戸市','八幡平市','奥州市','滝沢市','雫石町','葛巻町','岩手町','紫波町','矢巾町','西和賀町','金ケ崎町','平泉町','住田町','大槌町','山田町','岩泉町','田野畑村','普代村','軽米町','野田村','九戸村','洋野町','一戸町'];const palette=['#ffffff','#7cb8e5','#86c8a0','#b5a0e0','#edb76f','#ed9caf'];let db={},current=null,chosen='#7cb8e5',layers={};try{db=JSON.parse(localStorage.getItem('iwate-map-v1')||'{}')}catch{}const $=id=>document.getElementById(id);let map=null; if(window.L){try{map=L.map('map',{zoomControl:true}).setView([39.7,141.3],8);L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png',{maxZoom:17,attribution:'© 国土地理院'}).addTo(map)}catch(e){map=null}} if(!map){document.getElementById('map').innerHTML='<div style="padding:25px;text-align:center;color:#526879">背景地図を読み込めませんでした。下の市町村一覧から記録できます。</div>';document.getElementById('status').textContent='地図が利用できません。市町村一覧は使えます。'}function persist(){localStorage.setItem('iwate-map-v1',JSON.stringify(db));refresh()}function refresh(){let visited=names.filter(n=>db[n]?.color&&db[n].color!=='#ffffff').length;$('progress').textContent=`${visited} / 33 市町村`;for(let n of names){let b=document.querySelector(`[data-town="${n}"]`);if(b){b.style.borderLeft='7px solid '+(db[n]?.color||'#ffffff');b.classList.toggle('chosen',n===current)}if(layers[n])layers[n].setStyle({fillColor:db[n]?.color||'#ffffff',fillOpacity:db[n]?.color&&db[n].color!=='#ffffff'?.5:.08})}}function selectTown(n){current=n;chosen=db[n]?.color||'#7cb8e5';$('selected').textContent=n;$('editor').classList.remove('hidden');$('date').value=new Date().toLocaleDateString('sv-SE');$('memo').value='';$('colors').innerHTML='';palette.forEach(c=>{let el=document.createElement('button');el.className='swatch'+(chosen===c?' active':'');el.style.background=c;el.title=c==='#ffffff'?'未訪問':'塗る色';el.onclick=()=>{chosen=c;document.querySelectorAll('.swatch').forEach(x=>x.classList.remove('active'));el.classList.add('active')};$('colors').append(el)});showRecords();refresh();$('selected').scrollIntoView({behavior:'smooth',block:'nearest'})}function showRecords(){let list=$('records');list.innerHTML='';(db[current]?.records||[]).slice().reverse().forEach((r,i)=>{let li=document.createElement('li');li.textContent=`${r.date||'日付なし'}　${r.memo||'（メモなし）'} `;let del=document.createElement('button');del.textContent='削除';del.className='secondary';del.style.cssText='float:right;padding:3px 8px;font-size:11px';del.onclick=()=>{if(confirm('この記録を削除しますか？')){db[current].records.splice(db[current].records.length-1-i,1);persist();showRecords()}};li.append(del);list.append(li)})}function save(withRecord){if(!current)return;db[current]??={records:[]};db[current].color=chosen;if(withRecord){db[current].records.push({date:$('date').value,memo:$('memo').value})}$('memo').value='';persist();showRecords();alert('保存しました')} $('save').onclick=()=>save(true);$('coloronly').onclick=()=>save(false);for(let n of names){let b=document.createElement('button');b.className='town';b.dataset.town=n;b.textContent=n;b.onclick=()=>selectTown(n);$('towns').append(b)}refresh();$('export').onclick=()=>{let blob=new Blob([JSON.stringify({format:'iwate-map-v1',data:db},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='いわて旅ぬりマップ_バックアップ.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3000)};$('importBtn').onclick=()=>$('importFile').click();$('importFile').onchange=async e=>{try{let obj=JSON.parse(await e.target.files[0].text());if(obj.format!=='iwate-map-v1'||typeof obj.data!=='object')throw Error('形式が違います');if(confirm('現在の記録をバックアップ内容で置き換えますか？')){db=obj.data;persist();if(current)selectTown(current);alert('読み込みました')}}catch(err){alert('読み込みに失敗しました：'+err.message)}};
// geoBoundaries ADM2: availability/structure may change; fallback list always works.
(async()=>{if(!map)return;try{let controller=new AbortController();let timeout=setTimeout(()=>controller.abort(),10000);let r=await fetch('https://www.geoboundaries.org/api/current/gbOpen/JPN/ADM2/',{signal:controller.signal});clearTimeout(timeout);if(!r.ok)throw Error('API');let info=await r.json();let controller2=new AbortController();let timeout2=setTimeout(()=>controller2.abort(),12000);let geo=await(await fetch(info.simplifiedGeometryGeoJSON||info.gjDownloadURL,{signal:controller2.signal})).json();clearTimeout(timeout2);let count=0;L.geoJSON(geo,{filter:f=>{let p=f.properties||{},label=[p.shapeName,p.ADM2_JA,p.name].filter(Boolean).join(' ');return names.some(n=>label.includes(n))},style:f=>({color:'#2c617b',weight:1.2,fillColor:db[f.properties.shapeName]?.color||'#fff',fillOpacity:.15}),onEachFeature:(f,l)=>{let n=names.find(n=>(f.properties.shapeName||'').includes(n));if(n){layers[n]=l;l.on('click',()=>selectTown(n));count++}}}).addTo(map);if(!count)throw Error('岩手の市町村境界を識別できませんでした');$('status').textContent=`市町村境界を${count}件表示しました`;refresh()}catch(e){$('status').textContent='市町村境界は取得できませんでした。下の一覧から色塗り・記録ができます。'}})();
</script></body></html>
